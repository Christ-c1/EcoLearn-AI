name: EcoLearn AI CI/CD Pipeline

# Déclenchement du pipeline sur push ou PR vers la branche main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Variables d'environnement pour les chemins
env:
  BACKEND_DIR: backend
  FRONTEND_DIR: frontend

jobs:
  # ================== STAGE 1 : Backend Tests ==================
  backend-test:
    name: Backend - Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run backend tests
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          python -m pytest -v

  # ================== STAGE 2 : Frontend Build ==================
  frontend-build:
    name: Frontend - Build
    runs-on: ubuntu-latest
    needs: backend-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js 20
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          npm install -g pnpm
          pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          pnpm run build

  # ================== STAGE 3 : SonarCloud Analysis ==================
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: frontend-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        with:
          args: >
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}

  # ================== STAGE 4 : Deploy to AWS ECS ==================
  deploy:
    name: Deploy to AWS ECS
    runs-on: ubuntu-latest
    needs: sonarcloud

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-3

      - name: Deploy backend to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          service: ecolearn-backend
          cluster: ecolearn-cluster
          task-definition: backend/ecs-task-def.json
          wait-for-service-stability: true

      - name: Deploy frontend to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          service: ecolearn-frontend
          cluster: ecolearn-cluster
          task-definition: frontend/ecs-task-def.json
          wait-for-service-stability: true
