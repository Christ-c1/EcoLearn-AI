name: EcoLearn AI CI/CD Pipeline

# Déclenchement sur push ou PR pour les branches christ, prod et main
on:
  push:
    branches:
      - christ
      - prod
      - main
  pull_request:
    branches:
      - christ
      - prod
      - main

env:
  BACKEND_DIR: backend
  FRONTEND_DIR: frontend
  DOCKER_BACKEND_IMAGE: 899946341261.dkr.ecr.eu-north-1.amazonaws.com/ecolearn-backend
  DOCKER_FRONTEND_IMAGE: 899946341261.dkr.ecr.eu-north-1.amazonaws.com/ecolearn-frontend

jobs:
  backend-test:
    name: Backend - Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run backend tests
        working-directory: ${{ env.BACKEND_DIR }}
        run: python -m pytest -v

  frontend-build:
    name: Frontend - Build
    runs-on: ubuntu-latest
    needs: backend-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js 20
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          npm install -g pnpm
          pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: ${{ env.FRONTEND_DIR }}
        run: pnpm run build

  docker-deploy:
    name: Build & Push Docker Images to AWS ECR
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      # Login to AWS ECR
      - name: Login to AWS ECR
        run: |
          aws ecr get-login-password --region eu-north-1 | docker login --username AWS --password-stdin 899946341261.dkr.ecr.eu-north-1.amazonaws.com

      # Set Docker tag based on branch
      - name: Set Docker tag
        id: docker_tag
        run: echo "DOCKER_TAG=${GITHUB_REF##*/}" >> $GITHUB_ENV

      # Build and push backend image
      - name: Build & Push backend Docker image
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          docker build -t ${{ env.DOCKER_BACKEND_IMAGE }}:${{ env.DOCKER_TAG }} .
          docker push ${{ env.DOCKER_BACKEND_IMAGE }}:${{ env.DOCKER_TAG }}

      # Build and push frontend image
      - name: Build & Push frontend Docker image
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          docker build -t ${{ env.DOCKER_FRONTEND_IMAGE }}:${{ env.DOCKER_TAG }} .
          docker push ${{ env.DOCKER_FRONTEND_IMAGE }}:${{ env.DOCKER_TAG }}
